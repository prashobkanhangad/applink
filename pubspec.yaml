# Workspace root so the Dart analyzer resolves package: imports in invyto_deeplink_sdk.
# Not a runnable app — only so the IDE uses this package_config for the repo.
name: deep_link_workspace
description: Workspace root for DeepLink repo (enables IDE resolution for invyto_deeplink_sdk).
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  invyto_deeplink_sdk:
    path: deeplink_sdk
